[[task]]
name = "validate_estarlight_flux"
stage = "flux"
description = "Run the external eSTARlight narrow-W flux-ratio scan"
experimental = true
script = "scripts/flux/validate_estarlight_flux_ratio.py"
args = [
  "--executable", "{inputs.estarlight_executable}",
  "--template", "{paths.project}/{inputs.estarlight_template}",
  "--low-electron-gamma", "19569",
  "--low-target-gamma", "106.6",
  "--high-electron-gamma", "35225",
  "--high-target-gamma", "293.2",
  "--w-edges", "{analysis.common_w_edges}",
  "--q2-min", "0.0",
  "--q2-max", "{analysis.q2_flux_max}",
  "--n-events", "1",
  "--out", "{run.dir}/artifacts/flux/estarlight_flux_ratio.csv",
]
requirements = [
  "module:numpy", "module:pandas",
  "executable:{inputs.estarlight_executable}",
  "file:{inputs.estarlight_template}",
]
outputs = ["{run.dir}/artifacts/flux/estarlight_flux_ratio.csv"]
fail_patterns = ["Traceback", "Could not parse", "returned zero total cross section"]

