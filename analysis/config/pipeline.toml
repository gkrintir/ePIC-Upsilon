# ROOT schema gates. Later tasks depend on the narrowest applicable profile.

[[task]]
name = "validate_low_w_schema"
stage = "schema"
description = "Validate the low-energy tuple for W-dependent analyses"
script = "workflow/validate_root_schema.py"
args = [
  "{inputs.low_root}",
  "--tree", "{analysis.tree}",
  "--profile", "w",
  "--out", "{run.dir}/artifacts/schema/low_w.json",
]
requirements = ["module:ROOT", "file:{inputs.low_root}"]
outputs = ["{run.dir}/artifacts/schema/low_w.json"]

[[task]]
name = "validate_high_w_schema"
stage = "schema"
description = "Validate the high-energy tuple for W-dependent analyses"
script = "workflow/validate_root_schema.py"
args = [
  "{inputs.high_root}",
  "--tree", "{analysis.tree}",
  "--profile", "w",
  "--out", "{run.dir}/artifacts/schema/high_w.json",
]
requirements = ["module:ROOT", "file:{inputs.high_root}"]
outputs = ["{run.dir}/artifacts/schema/high_w.json"]

[[task]]
name = "validate_low_t_schema"
stage = "schema"
description = "Validate the low-energy tuple for all t estimators"
script = "workflow/validate_root_schema.py"
args = [
  "{inputs.low_root}",
  "--tree", "{analysis.tree}",
  "--profile", "t",
  "--branch", "weight_proj",
  "--out", "{run.dir}/artifacts/schema/low_t.json",
]
requirements = ["module:ROOT", "file:{inputs.low_root}"]
outputs = ["{run.dir}/artifacts/schema/low_t.json"]

[[task]]
name = "validate_high_t_schema"
stage = "schema"
description = "Validate the high-energy tuple for all t estimators"
script = "workflow/validate_root_schema.py"
args = [
  "{inputs.high_root}",
  "--tree", "{analysis.tree}",
  "--profile", "t",
  "--branch", "weight_proj",
  "--out", "{run.dir}/artifacts/schema/high_t.json",
]
requirements = ["module:ROOT", "file:{inputs.high_root}"]
outputs = ["{run.dir}/artifacts/schema/high_t.json"]

[[task]]
name = "validate_low_differential_schema"
stage = "schema"
description = "Validate the low-energy tuple for differential extraction"
script = "workflow/validate_root_schema.py"
args = [
  "{inputs.low_root}",
  "--tree", "{analysis.tree}",
  "--profile", "differential",
  "--branch", "reco_t_eX",
  "--out", "{run.dir}/artifacts/schema/low_differential.json",
]
requirements = ["module:ROOT", "file:{inputs.low_root}"]
outputs = ["{run.dir}/artifacts/schema/low_differential.json"]

[[task]]
name = "validate_high_differential_schema"
stage = "schema"
description = "Validate the high-energy tuple for differential extraction"
script = "workflow/validate_root_schema.py"
args = [
  "{inputs.high_root}",
  "--tree", "{analysis.tree}",
  "--profile", "differential",
  "--branch", "reco_t_eX",
  "--out", "{run.dir}/artifacts/schema/high_differential.json",
]
requirements = ["module:ROOT", "file:{inputs.high_root}"]
outputs = ["{run.dir}/artifacts/schema/high_differential.json"]

[[task]]
name = "validate_low_correlation_schema"
stage = "schema"
description = "Validate the low-energy tuple for track multiplicity correlations"
script = "workflow/validate_root_schema.py"
args = [
  "{inputs.low_root}",
  "--tree", "{analysis.tree}",
  "--profile", "correlation",
  "--out", "{run.dir}/artifacts/schema/low_correlation.json",
]
requirements = ["module:ROOT", "file:{inputs.low_root}"]
outputs = ["{run.dir}/artifacts/schema/low_correlation.json"]

[[task]]
name = "validate_high_correlation_schema"
stage = "schema"
description = "Validate the high-energy tuple for track multiplicity correlations"
script = "workflow/validate_root_schema.py"
args = [
  "{inputs.high_root}",
  "--tree", "{analysis.tree}",
  "--profile", "correlation",
  "--out", "{run.dir}/artifacts/schema/high_correlation.json",
]
requirements = ["module:ROOT", "file:{inputs.high_root}"]
outputs = ["{run.dir}/artifacts/schema/high_correlation.json"]

# Normalization and reconstruction diagnostics.

[[task]]
name = "validate_truth_two_energies"
stage = "normalization"
description = "Compare truth-level gamma-p extraction in the common W range"
script = "scripts/validation/validate_truth_gamma_p_two_energies.py"
deps = ["validate_low_w_schema", "validate_high_w_schema"]
args = [
  "--low-file", "{inputs.low_root}",
  "--high-file", "{inputs.high_root}",
  "--tree", "{analysis.tree}",
  "--low-ee", "{beam.low.electron_energy}",
  "--low-ep", "{beam.low.proton_energy}",
  "--high-ee", "{beam.high.electron_energy}",
  "--high-ep", "{beam.high.proton_energy}",
  "--low-xsec-visible-fb", "{beam.low.visible_xsec_1s_fb}",
  "--high-xsec-visible-fb", "{beam.high.visible_xsec_1s_fb}",
  "--tuple-lumi-invfb", "{analysis.tuple_lumi_invfb}",
  "--lumi-invfb", "{analysis.lumi_invfb}",
  "--w-min", "{beam.low.w_min}",
  "--w-max", "{beam.low.w_max}",
  "--n-w-bins", "10",
  "--q2-max-flux", "{analysis.q2_flux_max}",
  "--q2-cut", "{analysis.q2_event_max}",
  "--mass-half-width", "{analysis.truth_mass_window}",
  "--out-prefix", "{run.dir}/artifacts/normalization/truth_two_energies",
]
requirements = ["module:ROOT", "module:numpy", "module:pandas", "module:matplotlib", "module:mplhep"]
outputs = [
  "{run.dir}/artifacts/normalization/truth_two_energies.csv",
  "{run.dir}/artifacts/normalization/truth_two_energies_meta.csv",
  "{run.dir}/artifacts/normalization/truth_two_energies.png",
]
fail_patterns = ["Traceback", "Could not open", "Could not find tree"]

[[task]]
name = "validate_high_mass_fit_yields"
stage = "normalization"
description = "Cross-check high-energy mass-fit and cross-section yield conventions"
script = "scripts/validation/validate_mass_fit_yield_accounting.py"
deps = ["validate_high_w_schema"]
args = [
  "{inputs.high_root}",
  "--tree", "{analysis.tree}",
  "--lumi-invfb", "{analysis.lumi_invfb}",
  "--electron-energy", "{beam.high.electron_energy}",
  "--w-min", "{beam.high.w_min}",
  "--w-max", "{beam.high.w_max}",
  "--truth-mass-window", "{analysis.truth_mass_window}",
  "--reco-mass-window-sigma", "{analysis.reco_mass_window_sigma}",
  "--state-normalize",
  "--visible-xsecs-fb", "1S:{beam.high.visible_xsec_1s_fb},2S:{beam.high.visible_xsec_2s_fb},3S:{beam.high.visible_xsec_3s_fb}",
  "--out-csv", "{run.dir}/artifacts/normalization/high_mass_fit_yields.csv",
]
requirements = ["module:ROOT", "module:numpy"]
outputs = ["{run.dir}/artifacts/normalization/high_mass_fit_yields.csv"]
fail_patterns = ["Traceback", "empty truth state", "zero raw"]

[[task]]
name = "validate_high_w_resolution"
stage = "resolution"
description = "Measure high-energy W reconstruction response and resolution"
script = "scripts/validation/validate_w_resolution.py"
deps = ["validate_high_w_schema"]
args = [
  "{inputs.high_root}",
  "--tree", "{analysis.tree}",
  "--state", "1S",
  "--electron-energy", "{beam.high.electron_energy}",
  "--w-edges", "{beam.high.w_edges}",
  "--q2-cut", "{analysis.q2_event_max}",
  "--mass-window-sigma", "{analysis.reco_mass_window_sigma}",
  "--true-mass-window", "{analysis.truth_mass_window}",
  "--out-prefix", "{run.dir}/artifacts/resolution/high_w",
]
requirements = ["module:ROOT", "module:numpy", "module:pandas", "module:matplotlib", "module:mplhep"]
outputs = [
  "{run.dir}/artifacts/resolution/high_w_W_resolution_summary.csv",
  "{run.dir}/artifacts/resolution/high_w_response_counts_selected.csv",
  "{run.dir}/artifacts/resolution/high_w_W_resolution_vs_W.png",
  "{run.dir}/artifacts/resolution/high_w_W_relative_resolution_vs_W.png",
]
fail_patterns = ["Traceback", "Histogram is empty", "selection is empty"]

[[task]]
name = "diagnose_low_gamma_p_normalization"
stage = "normalization"
description = "Write the verbose low-energy gamma-p normalization debug table"
script = "scripts/validation/validate_gamma_p_normalization.py"
deps = ["validate_low_w_schema"]
args = [
  "{inputs.low_root}",
  "--tree", "{analysis.tree}",
  "--out-csv", "{run.dir}/artifacts/normalization/low_gamma_p_debug.csv",
  "--theory-csv", "{inputs.ct18_csv}",
  "--electron-energy", "{beam.low.electron_energy}",
  "--proton-energy", "{beam.low.proton_energy}",
  "--q2-max", "{analysis.q2_flux_max}",
  "--w-min", "{beam.low.w_min}",
  "--w-max", "{beam.low.w_max}",
  "--n-w-bins", "10",
  "--lumi-invfb", "{analysis.lumi_invfb}",
  "--tuple-lumi-invfb", "{analysis.tuple_lumi_invfb}",
  "--expected-generator-xsec-fb", "{beam.low.generator_xsec_fb}",
  "--weight-convention", "visible_decay",
  "--mass-window-sigma", "{analysis.reco_mass_window_sigma}",
  "--true-mass-window", "{analysis.truth_mass_window}",
]
requirements = ["module:ROOT", "module:numpy", "module:pandas"]
outputs = ["{run.dir}/artifacts/normalization/low_gamma_p_debug.csv"]
fail_patterns = ["Traceback", "ERROR: input file not found", "Could not identify"]

# W-dependent gamma-p cross sections.

[[task]]
name = "extract_low_sigma_gamma_p"
stage = "cross_section"
description = "Extract the low-energy Upsilon(1S) gamma-p cross section"
script = "scripts/cross_sections/extract_gamma_p_cross_sections_bin_by_bin.py"
deps = ["validate_low_w_schema"]
args = [
  "{inputs.low_root}",
  "--tree", "{analysis.tree}",
  "--out-prefix", "{run.dir}/artifacts/cross_sections/low_sigma_gamma_p_1s",
  "--states", "1S",
  "--lumi-invfb", "{analysis.lumi_invfb}",
  "--tuple-lumi-invfb", "{analysis.tuple_lumi_invfb}",
  "--electron-energy", "{beam.low.electron_energy}",
  "--proton-energy", "{beam.low.proton_energy}",
  "--q2-max", "{analysis.q2_flux_max}",
  "--q2-cut", "{analysis.q2_event_max}",
  "--w-min", "{beam.low.w_min}",
  "--w-max", "{beam.low.w_max}",
  "--n-w-bins", "10",
  "--mass-window-sigma", "{analysis.reco_mass_window_sigma}",
  "--true-mass-window", "{analysis.truth_mass_window}",
  "--visible-xsec-1s-fb", "{beam.low.visible_xsec_1s_fb}",
  "--visible-xsec-2s-fb", "{beam.low.visible_xsec_2s_fb}",
  "--visible-xsec-3s-fb", "{beam.low.visible_xsec_3s_fb}",
  "--weight-convention", "visible_decay",
  "--normalization-scope", "truth_state",
  "--min-eff", "0.05",
  "--no-hera",
]
requirements = ["module:ROOT", "module:numpy", "module:pandas", "module:matplotlib", "module:mplhep"]
outputs = [
  "{run.dir}/artifacts/cross_sections/low_sigma_gamma_p_1s.csv",
  "{run.dir}/artifacts/cross_sections/low_sigma_gamma_p_1s_normalization.csv",
  "{run.dir}/artifacts/cross_sections/low_sigma_gamma_p_1s.png",
]
fail_patterns = ["Traceback", "truth selection is empty", "Skipping 1S"]

[[task]]
name = "extract_high_sigma_gamma_p_family"
stage = "cross_section"
description = "Extract high-energy gamma-p cross sections for all three Upsilon states"
script = "scripts/cross_sections/extract_gamma_p_cross_sections_bin_by_bin.py"
deps = ["validate_high_w_schema"]
args = [
  "{inputs.high_root}",
  "--tree", "{analysis.tree}",
  "--out-prefix", "{run.dir}/artifacts/cross_sections/high_sigma_gamma_p_family",
  "--states", "1S,2S,3S",
  "--lumi-invfb", "{analysis.lumi_invfb}",
  "--tuple-lumi-invfb", "{analysis.tuple_lumi_invfb}",
  "--electron-energy", "{beam.high.electron_energy}",
  "--proton-energy", "{beam.high.proton_energy}",
  "--q2-max", "{analysis.q2_flux_max}",
  "--q2-cut", "{analysis.q2_event_max}",
  "--w-min", "{beam.high.w_min}",
  "--w-max", "{beam.high.w_max}",
  "--n-w-bins", "9",
  "--mass-window-sigma", "{analysis.reco_mass_window_sigma}",
  "--true-mass-window", "{analysis.truth_mass_window}",
  "--visible-xsec-1s-fb", "{beam.high.visible_xsec_1s_fb}",
  "--visible-xsec-2s-fb", "{beam.high.visible_xsec_2s_fb}",
  "--visible-xsec-3s-fb", "{beam.high.visible_xsec_3s_fb}",
  "--weight-convention", "visible_decay",
  "--normalization-scope", "truth_state",
  "--min-eff", "0.05",
  "--no-hera",
]
requirements = ["module:ROOT", "module:numpy", "module:pandas", "module:matplotlib", "module:mplhep"]
outputs = [
  "{run.dir}/artifacts/cross_sections/high_sigma_gamma_p_family.csv",
  "{run.dir}/artifacts/cross_sections/high_sigma_gamma_p_family_normalization.csv",
  "{run.dir}/artifacts/cross_sections/high_sigma_gamma_p_family.png",
]
fail_patterns = ["Traceback", "truth selection is empty", "Skipping 1S", "Skipping 2S", "Skipping 3S"]

[[task]]
name = "plot_sigma_gamma_p_two_energies"
stage = "plotting"
description = "Overlay low- and high-energy gamma-p cross sections"
script = "scripts/plotting/plot_gamma_p_cross_sections_by_energy.py"
deps = ["extract_low_sigma_gamma_p", "extract_high_sigma_gamma_p_family"]
args = [
  "--low-csv", "{run.dir}/artifacts/cross_sections/low_sigma_gamma_p_1s.csv",
  "--high-csv", "{run.dir}/artifacts/cross_sections/high_sigma_gamma_p_family.csv",
  "--low-label", "{beam.low.label}",
  "--high-label", "{beam.high.label}",
  "--states", "1S",
  "--min-eff", "0.05",
  "--require-plotted",
  "--out-prefix", "{run.dir}/artifacts/figures/sigma_gamma_p_two_energies",
  "--q2-label", "Q2 < 0.001 GeV2",
  "--lumi-label", "Lep = 10 fb-1",
]
requirements = ["module:numpy", "module:pandas", "module:matplotlib", "module:mplhep"]
outputs = [
  "{run.dir}/artifacts/figures/sigma_gamma_p_two_energies.csv",
  "{run.dir}/artifacts/figures/sigma_gamma_p_two_energies.png",
  "{run.dir}/artifacts/figures/sigma_gamma_p_two_energies.pdf",
]
fail_patterns = ["Traceback", "No valid", "empty"]

# Report-era input recovery and notebook reruns. The promoted histogram tasks
# are ROOT-macro independent and use uproot/NumPy. Selected legacy notebook
# cells still run in private directories with in-memory path replacements.

[[task]]
name = "validate_report_histogram_reconstruction"
stage = "validation"
description = "Reconstruct all ten report-era TH2 histograms from UpsilonTree and compare every flow bin"
script = "scripts/validation/reconstruct_report_histograms_from_tuple.py"
args = [
  "--tuple-root", "{inputs.high_legacy_root}",
  "--reference-root", "{inputs.campaign_new_root}",
  "--tree", "{analysis.tree}",
  "--out-json", "{run.dir}/artifacts/report/input_crosscheck/tuple_th2_validation.json",
  "--out-npz", "{run.dir}/artifacts/report/input_crosscheck/reconstructed_report_th2.npz",
