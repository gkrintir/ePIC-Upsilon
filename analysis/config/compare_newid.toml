version = 1

# Additive comparisons for output_newID and legacy-ID 9x275 fEMC half-plane samples.
# It does not replace existing pipelines. The half-plane samples use LEGACY electron ID.
# Each curve is normalized separately. Fractions use stored tuple rows as the denominator.
# This pipeline compares shapes and tuple selections, not absolute yields or sigma(W).

[executables]
python = "python3"

[inputs]
# Override individual file paths if the merged filenames differ.
baseline_9x130_root = "/eos/cms/store/group/phys_top/gkrintir/upsilon_data/Upsilon1S/9x130/hiAcc/output/merged_Upsilon_final.root"
root_9x130 = "/eos/cms/store/group/phys_top/gkrintir/upsilon_data/Upsilon1S/9x130/hiAcc/output_newID/merged_Upsilon_final.root"
baseline_9x275_root = "/eos/cms/store/group/phys_top/gkrintir/upsilon_data/Upsilon1S/9x275/hiAcc/output/merged_Upsilon_final.root"
root_9x275 = "/eos/cms/store/group/phys_top/gkrintir/upsilon_data/Upsilon1S/9x275/hiAcc/output_newID/merged_Upsilon_final.root"

# fEMC half-plane producer modes 4 (y<0) and 3 (x>=0) use LEGACY electron ID.
keep_yneg_9x275_root = "/eos/cms/store/group/phys_top/gkrintir/upsilon_data/Upsilon1S/9x275/hiAcc/output_keep_yneg/merged_Upsilon_final.root"
keep_xpos_9x275_root = "/eos/cms/store/group/phys_top/gkrintir/upsilon_data/Upsilon1S/9x275/hiAcc/output_keep_xpos/merged_Upsilon_final.root"

[comparison]
tree = "UpsilonTree"
state = "1S"
electron_energy = 9.0
bins = 60

[groups]
compare_newid = ["compare_id_9x130_samples", "compare_id_9x275_samples", "compare_newid_energies_samples"]
compare_id_9x130 = ["compare_id_9x130_samples"]
compare_id_9x275 = ["compare_id_9x275_samples"]
compare_newid_energies = ["compare_newid_energies_samples"]

compare_halfplanes_9x275 = ["compare_9x275_keep_yneg_samples", "compare_9x275_keep_xpos_samples"]
compare_keep_yneg_9x275 = ["compare_9x275_keep_yneg_samples"]
compare_keep_xpos_9x275 = ["compare_9x275_keep_xpos_samples"]
compare_ele_id_all = ["compare_id_9x130_samples", "compare_id_9x275_samples", "compare_newid_energies_samples", "compare_9x275_keep_yneg_samples", "compare_9x275_keep_xpos_samples"]

[[task]]
name = "compare_id_9x130_samples"
stage = "comparison"
description = "Compare 9x130 GeV, previous electron ID with 9x130 GeV, new electron ID: shapes and tuple selection fractions"
script = "scripts/validation/compare_newid_samples.py"
args = [
  "--reference-file", "{inputs.baseline_9x130_root}",
  "--candidate-file", "{inputs.root_9x130}",
  "--tree", "{comparison.tree}",
  "--state", "{comparison.state}",
  "--reference-label", "9x130 GeV, previous electron ID",
  "--candidate-label", "9x130 GeV, new electron ID",
  "--reference-electron-energy", "{comparison.electron_energy}",
  "--candidate-electron-energy", "{comparison.electron_energy}",
  "--bins", "{comparison.bins}",
  "--out-dir", "{run.dir}/artifacts/comparisons/id_9x130",
]
requirements = [
  "module:numpy", "module:matplotlib", "module:uproot",
  "file:{inputs.baseline_9x130_root}", "file:{inputs.root_9x130}",
]
outputs = [
  "{run.dir}/artifacts/comparisons/id_9x130/truth_shapes.png",
  "{run.dir}/artifacts/comparisons/id_9x130/truth_shapes.pdf",
  "{run.dir}/artifacts/comparisons/id_9x130/reco_shapes.png",
  "{run.dir}/artifacts/comparisons/id_9x130/reco_shapes.pdf",
  "{run.dir}/artifacts/comparisons/id_9x130/selection_summary.csv",
  "{run.dir}/artifacts/comparisons/id_9x130/bin_values.csv",
  "{run.dir}/artifacts/comparisons/id_9x130/comparison_manifest.json",
]
fail_patterns = ["Traceback", "Comparison failed:"]

