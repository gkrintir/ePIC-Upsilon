[[task]]
name = "unfold_9x130_t_spectrum"
stage = "t_unfolding"
description = "Unfold the 9x130 pT2 estimator against true t for closure diagnostics"
script = "scripts/unfolding/unfold_t_spectrum.py"
deps = ["validate_9x130_schema"]
