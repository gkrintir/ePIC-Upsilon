[[task]]
name = "prepare_9x130"
stage = "normalization"
description = "Normalize the complete 9x130 input once and record the normalization source"
script = "scripts/validation/prepare_latest_sample.py"
args = [
  "--generator-branching-fraction", "{analysis.generator_branching_fraction}", "--normalization-profile", "{analysis.normalization_profile}",
  "--input", "{inputs.root_9x130}",
  "--tree", "{analysis.tree}",
  "--cross-section-fb", "{beam.low.visible_xsec_1s_fb}",
  "--lumi-invfb", "{analysis.tuple_lumi_invfb}",
  "--normalization-source", "{beam.low.normalization_source}",
  "--out-root", "{run.dir}/artifacts/inputs/9x130_normalized.root",
  "--out-json", "{run.dir}/artifacts/normalization/9x130_input_audit.json",
]
requirements = ["module:uproot", "module:numpy", "file:{inputs.root_9x130}"]
outputs = [
  "{run.dir}/artifacts/inputs/9x130_normalized.root",
  "{run.dir}/artifacts/normalization/9x130_input_audit.json",
]
fail_patterns = ["Traceback"]

[[task]]
name = "validate_9x130_schema"
stage = "schema"
description = "Check all latest 9x130 analysis branches"
script = "workflow/validate_root_schema.py"
deps = ["prepare_9x130"]
args = [
  "{run.dir}/artifacts/inputs/9x130_normalized.root",
  "--tree", "{analysis.tree}",
  "--profile", "t",
  "--branch", "true_pT",
  "--branch", "true_y",
  "--branch", "reco_y",
  "--branch", "weight_proj",
  "--branch", "reco_nTracks_Central",
  "--branch", "reco_nTracks_Tagger",
  "--out", "{run.dir}/artifacts/schema/9x130.json",
]
requirements = ["module:uproot"]
outputs = [
  "{run.dir}/artifacts/schema/9x130.json",
]
fail_patterns = ["Traceback"]

[[task]]
name = "validate_9x130_w_resolution"
stage = "resolution"
description = "Measure 9x130 W response and resolution"
script = "scripts/validation/validate_w_resolution.py"
deps = ["validate_9x130_schema"]
args = [
  "{run.dir}/artifacts/inputs/9x130_normalized.root",
  "--tree", "{analysis.tree}",
  "--state", "1S",
  "--electron-energy", "{beam.low.electron_energy}",
  "--w-edges", "{beam.low.w_edges}",
  "--q2-cut", "{analysis.q2_event_max}",
  "--mass-window-sigma", "{analysis.reco_mass_window_sigma}",
  "--true-mass-window", "{analysis.truth_mass_window}",
  "--out-prefix", "{run.dir}/artifacts/resolution/9x130_w",
]
requirements = ["module:uproot", "module:numpy", "module:pandas", "module:matplotlib", "module:mplhep"]
outputs = [
  "{run.dir}/artifacts/resolution/9x130_w_W_resolution_summary.csv",
  "{run.dir}/artifacts/resolution/9x130_w_response_counts_selected.csv",
  "{run.dir}/artifacts/resolution/9x130_w_W_resolution_vs_W.png",
  "{run.dir}/artifacts/resolution/9x130_w_W_relative_resolution_vs_W.png",
  "{run.dir}/artifacts/resolution/9x130_w_deltaW_distributions.png",
  "{run.dir}/artifacts/resolution/9x130_w_response_counts.png",
]
fail_patterns = ["Traceback"]

# This is yield accounting, not an invariant-mass fit. Do not state-normalize again.
[[task]]
name = "validate_9x130_mass_fit_yields"
stage = "normalization"
description = "Compare 9x130 selected 1S yield conventions with prepared weights"
script = "scripts/validation/validate_mass_fit_yield_accounting.py"
deps = ["validate_9x130_schema"]
args = [
  "--branching-fractions", "{analysis.branching_fractions}",
  "{run.dir}/artifacts/inputs/9x130_normalized.root",
  "--tree", "{analysis.tree}",
  "--states", "1S",
  "--lumi-invfb", "{analysis.tuple_lumi_invfb}",
  "--electron-energy", "{beam.low.electron_energy}",
  "--w-min", "{beam.low.w_min}",
  "--w-max", "{beam.low.w_max}",
  "--q2-cut", "{analysis.q2_event_max}",
  "--n-w-bins", "{beam.low.n_w_bins}",
  "--truth-mass-window", "{analysis.truth_mass_window}",
  "--reco-mass-window-sigma", "{analysis.reco_mass_window_sigma}",
  "--visible-xsecs-fb", "1S:{beam.low.visible_xsec_1s_fb}",
  "--out-csv", "{run.dir}/artifacts/normalization/9x130_mass_fit_yields.csv",
]
requirements = ["module:uproot", "module:numpy"]
outputs = [
  "{run.dir}/artifacts/normalization/9x130_mass_fit_yields.csv",
]
fail_patterns = ["Traceback"]

[[task]]
name = "plot_9x130_track_correlation"
stage = "correlation"
description = "Plot 9x130 central and tagger track correlations"
script = "scripts/validation/plot_track_multiplicity_correlation.py"
deps = ["validate_9x130_schema"]
args = [
  "{run.dir}/artifacts/inputs/9x130_normalized.root",
  "--tree", "{analysis.tree}",
  "--state", "1S",
  "--electron-energy", "{beam.low.electron_energy}",
  "--w-min", "{beam.low.w_min}",
  "--w-max", "{beam.low.w_max}",
  "--q2-cut", "{analysis.q2_event_max}",
  "--energy-label", "{beam.low.label}",
  "--campaign", "Jul26 latest 1S",
  "--out-prefix", "{run.dir}/artifacts/correlation/9x130_central_tagger",
]
requirements = ["module:uproot", "module:numpy", "module:pandas", "module:matplotlib", "module:mplhep"]
outputs = [
  "{run.dir}/artifacts/correlation/9x130_central_tagger.png",
  "{run.dir}/artifacts/correlation/9x130_central_tagger.pdf",
  "{run.dir}/artifacts/correlation/9x130_central_tagger_summary.csv",
  "{run.dir}/artifacts/correlation/9x130_central_tagger_map.csv",
]
fail_patterns = ["Traceback"]

[[task]]
name = "extract_9x130_sigma_gamma_p"
stage = "cross_section"
description = "Extract 9x130 1S gamma-p cross sections with the assigned visible normalization"
script = "scripts/cross_sections/extract_gamma_p_cross_sections_bin_by_bin.py"
deps = ["validate_9x130_schema"]
args = [
  "--branching-fractions", "{analysis.branching_fractions}",
  "{run.dir}/artifacts/inputs/9x130_normalized.root",
  "--tree", "{analysis.tree}",
  "--states", "1S",
  "--electron-energy", "{beam.low.electron_energy}",
  "--w-min", "{beam.low.w_min}",
  "--w-max", "{beam.low.w_max}",
  "--q2-cut", "{analysis.q2_event_max}",
  "--lumi-invfb", "{analysis.lumi_invfb}",
  "--tuple-lumi-invfb", "{analysis.tuple_lumi_invfb}",
  "--proton-energy", "{beam.low.proton_energy}",
  "--q2-max", "{analysis.q2_flux_max}",
  "--n-w-bins", "{beam.low.n_w_bins}",
  "--mass-window-sigma", "{analysis.reco_mass_window_sigma}",
  "--true-mass-window", "{analysis.truth_mass_window}",
  "--visible-xsec-1s-fb", "{beam.low.visible_xsec_1s_fb}",
  "--weight-convention", "visible_decay",
  "--state-norm-mode", "raw",
  "--min-eff", "0.05",
  "--no-hera",
  "--out-prefix", "{run.dir}/artifacts/cross_sections/9x130_sigma_gamma_p_1s",
]
requirements = ["module:uproot", "module:numpy", "module:pandas", "module:matplotlib", "module:mplhep"]
outputs = [
  "{run.dir}/artifacts/cross_sections/9x130_sigma_gamma_p_1s.csv",
  "{run.dir}/artifacts/cross_sections/9x130_sigma_gamma_p_1s_normalization.csv",
  "{run.dir}/artifacts/cross_sections/9x130_sigma_gamma_p_1s.png",
]
fail_patterns = ["Traceback"]

[[task]]
name = "extract_9x130_differential_gamma_p"
stage = "differential"
description = "Extract 9x130 1S pT2 and rapidity spectra and a pT2 slope"
script = "scripts/cross_sections/extract_differential_gamma_p_bin_by_bin.py"
deps = ["validate_9x130_schema"]
args = [
  "--branching-fractions", "{analysis.branching_fractions}",
  "{run.dir}/artifacts/inputs/9x130_normalized.root",
  "--tree", "{analysis.tree}",
  "--states", "1S",
  "--electron-energy", "{beam.low.electron_energy}",
  "--w-min", "{beam.low.w_min}",
  "--w-max", "{beam.low.w_max}",
  "--q2-cut", "{analysis.q2_event_max}",
  "--lumi-invfb", "{analysis.lumi_invfb}",
  "--tuple-lumi-invfb", "{analysis.tuple_lumi_invfb}",
  "--proton-energy", "{beam.low.proton_energy}",
  "--q2-max", "{analysis.q2_flux_max}",
  "--visible-xsec-1s-fb", "{beam.low.visible_xsec_1s_fb}",
  "--no-state-normalize",
  "--output-convention", "inclusive_upsilon",
  "--variables", "pT2,y",
  "--pt2-bins", "{analysis.t_edges}",
  "--y-bins=-1,-0.5,0,0.5,1,1.5,2,2.5,3",
  "--truth-mass-window", "{analysis.truth_mass_window}",
  "--reco-mass-window-sigma", "{analysis.reco_mass_window_sigma}",
  "--min-eff", "0.05",
  "--fit-b-slope",
  "--b-slope-variable", "pT2",
  "--b-slope-bins", "{analysis.t_edges}",
  "--campaign", "Jul26 latest 1S",
  "--energy-label", "{beam.low.label}",
  "--out-prefix", "{run.dir}/artifacts/differential/9x130_1s",
]
requirements = ["module:uproot", "module:numpy", "module:pandas", "module:matplotlib", "module:mplhep"]
outputs = [
  "{run.dir}/artifacts/differential/9x130_1s_1S_all.csv",
  "{run.dir}/artifacts/differential/9x130_1s_1S_b_slope_bins.csv",
  "{run.dir}/artifacts/differential/9x130_1s_b_slope_summary.csv",
  "{run.dir}/artifacts/differential/9x130_1s_metadata.csv",
  "{run.dir}/artifacts/differential/9x130_1s_pt2_y.png",
  "{run.dir}/artifacts/differential/9x130_1s_pt2_y.pdf",
]
fail_patterns = ["Traceback"]

